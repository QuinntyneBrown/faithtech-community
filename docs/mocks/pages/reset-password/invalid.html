    <div class="card stack"><h1 class="text-center">Choose a new password</h1>
<form class="stack" action="success.html" method="get" novalidate><div class="alert alert--danger form-summary" role="alert" tabindex="-1" id="summary"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div class="alert__body"><div class="alert__title">Fix 2 things to save your password</div><ol><li><a href="#rp-new">Password needs at least 12 characters</a></li><li><a href="#rp-confirm">Passwords don’t match</a></li></ol></div></div>
<div class="field"><label class="field__label" for="rp-new">New password</label><input class="input" id="rp-new" name="rp-new" type="password" value="maple7" autocomplete="new-password" required aria-invalid="true" aria-describedby="rp-new-help rp-new-error"><div class="field__help" id="rp-new-help">At least 12 characters.</div><div class="field__error" id="rp-new-error">Use at least 12 characters.</div></div>
<div class="field"><label class="field__label" for="rp-confirm">Confirm new password</label><input class="input" id="rp-confirm" name="rp-confirm" type="password" value="maple777" autocomplete="new-password" required aria-invalid="true" aria-describedby="rp-confirm-error"><div class="field__error" id="rp-confirm-error">This doesn’t match the password above.</div></div>
<button class="btn btn--primary btn--lg btn--block" type="submit">Save password</button></form></div>
