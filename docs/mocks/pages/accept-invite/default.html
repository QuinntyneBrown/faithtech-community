<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo"><span class="logo-mark"><img src="../../assets/logo.svg" alt="FaithTech" width="64" height="64"></span></div>
    <div class="card stack"><h1 style="text-align: center;">You’re invited</h1>
<div class="cluster" style="justify-content: center;"><span class="avatar avatar--sm avatar--sky" aria-hidden="true">GO</span><p><strong>Grace Okonkwo</strong> invited you to join FaithTech Toronto as a <span class="badge badge--role">Volunteer</span></p></div>
<form class="stack" action="../../pages/edit-profile/default.html" method="get" novalidate>
<div class="field"><label class="field__label" for="ai-name">Full name</label><input class="input" id="ai-name" name="ai-name" type="text" value="Ruth Alvarez" autocomplete="name" required></div>
<div class="field"><label class="field__label" for="ai-email">Email</label><input class="input" id="ai-email" type="email" value="ruth.alvarez@example.org" readonly aria-describedby="ai-email-help"><div class="field__help" id="ai-email-help">The invite was sent to this address.</div></div>
<div class="field"><label class="field__label" for="ai-password">Create a password</label><input class="input" id="ai-password" name="ai-password" type="password" autocomplete="new-password" required aria-describedby="ai-password-help"><div class="field__help" id="ai-password-help">At least 12 characters.</div></div>
<button class="btn btn--primary btn--lg btn--block" type="submit">Accept and join</button></form></div>
    
  </div>
</main>
