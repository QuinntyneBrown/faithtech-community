<ft-page-header title="Search" />

<form class="search-form" role="search" (submit)="$event.preventDefault(); submit()">
  <ft-cluster gap="2">
    <ft-text-field
      class="grow"
      type="search"
      label="Search"
      placeholder="Search people, events, partners and contacts"
      [formControl]="field"
    />
    <ft-button type="submit" variant="primary"><ft-icon name="search" /> Search</ft-button>
  </ft-cluster>
</form>

@switch (state()) {
  @case ('idle') {
    <ft-empty-state
      icon="search"
      heading="Search all of FaithTech"
      text="Find people by name or role, events by title or city, and partners by organisation. Leads also see their own private contacts."
    />
  }
  @case ('short') {
    <p class="hint" role="status">Type at least 2 characters to search.</p>
  }
  @case ('loading') {
    <p class="visually-hidden" role="status">Searching…</p>
    <ft-list-skeleton label="Searching" [rows]="4" />
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load search results"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (resultGroups().length === 0) {
      <ft-empty-state
        icon="search"
        [heading]="'No results for “' + term() + '”'"
        text="Check the spelling, try fewer words, or search for a person’s first name."
      >
        <ft-button actions href="/search">Clear search</ft-button>
      </ft-empty-state>
    } @else {
      <ft-search-results [query]="term()" [groups]="resultGroups()" />
    }
  }
}
