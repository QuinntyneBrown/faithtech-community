<ft-dialog
  [heading]="'Suspend ' + data.name + '?'"
  description="They’ll be signed out everywhere and can’t sign in until reinstated. This is recorded in the audit log."
  icon="suspended"
  tone="danger"
  [busy]="busy()"
  (closed)="ref.close(false)"
>
  <ft-stack>
    @if (failed()) {
      <ft-alert status="danger" heading="That didn’t work">
        We couldn’t reach FaithTech. Nothing was changed — try again.
      </ft-alert>
    }
    @if (refusal(); as message) {
      <ft-alert status="danger" heading="That didn’t work">{{ message }}</ft-alert>
    }
    <ft-form-field label="Reason (recorded in the audit log)" [error]="error()">
      <ft-textarea [formControl]="reason" [rows]="3" initialFocus />
    </ft-form-field>
  </ft-stack>
  <ft-button ftDialogFooter [disabled]="busy()" (click)="ref.close(false)">Cancel</ft-button>
  <ft-button ftDialogFooter variant="danger" [loading]="busy()" (click)="confirm()">
    {{ busy() ? 'Suspend…' : 'Suspend' }}
  </ft-button>
</ft-dialog>
