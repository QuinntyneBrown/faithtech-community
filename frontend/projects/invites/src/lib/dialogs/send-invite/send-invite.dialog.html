<ft-dialog
  heading="Invite someone to FaithTech"
  description="They’ll get an email with a link to create their account."
  icon="invite"
  [busy]="busy()"
  (closed)="ref.close()"
>
  <form [formGroup]="form" (submit)="$event.preventDefault(); send()">
    <ft-stack>
      @if (failed()) {
        <ft-alert status="danger" heading="Invite not sent">
          We couldn’t reach FaithTech. Nothing was changed — try again.
        </ft-alert>
      }
      @if (refusal(); as message) {
        <ft-alert status="danger" heading="You can’t send this invite">{{ message }}</ft-alert>
      }
      <ft-form-field label="Email" [error]="emailError()">
        <ft-text-field
          type="email"
          formControlName="email"
          autocomplete="off"
          [readonly]="busy()"
        />
      </ft-form-field>
      @if (roleOptions().length > 1) {
        <ft-form-field label="Join with role">
          <ft-select formControlName="role" [options]="roleOptions()" />
        </ft-form-field>
      }
      <ft-form-field label="Personal note" [optional]="true" [error]="noteError()">
        <ft-textarea formControlName="note" [rows]="2" [readonly]="busy()" />
      </ft-form-field>
      <p class="text-caption">The invite link lasts 14 days.</p>
    </ft-stack>
  </form>
  <ft-button ftDialogFooter [disabled]="busy()" (click)="ref.close()">Cancel</ft-button>
  <ft-button ftDialogFooter variant="primary" [loading]="busy()" (click)="send()">
    {{ busy() ? 'Send invite…' : 'Send invite' }}
  </ft-button>
</ft-dialog>
