<ft-page-header title="Settings" />

<ft-stack width="md">
  <ft-card heading="Appearance">
    <ft-stack>
      <ft-radio-group
        legend="Theme"
        name="theme"
        [ngModel]="preference()"
        (ngModelChange)="choose($event)"
      >
        <ft-radio value="light">Light</ft-radio>
        <ft-radio value="dark">Dark</ft-radio>
        <ft-radio value="system" description="Follows your device’s light or dark setting">
          Match my device
        </ft-radio>
      </ft-radio-group>
      <p class="caption">Changes straight away and is remembered on this device.</p>
    </ft-stack>
  </ft-card>
  <ft-card heading="Email me when">
    <ft-stack>
      <ft-switch [formControl]="emailAnnouncements">Email me announcements</ft-switch>
      <p class="caption">You’ll always get account emails like password resets.</p>
      <!-- A live region from the start, so the alert that appears in it is announced. -->
      <div class="status" aria-live="polite">
        @if (save() === 'saved') {
          <ft-alert status="success" heading="Settings saved">
            It applies from the next announcement.
          </ft-alert>
        }
      </div>
      @if (save() === 'failed') {
        <ft-inline-message>We couldn’t save that. Try again.</ft-inline-message>
      }
    </ft-stack>
  </ft-card>
</ft-stack>
