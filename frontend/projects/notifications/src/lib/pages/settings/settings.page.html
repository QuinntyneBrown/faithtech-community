<ft-page-header title="Settings" />

<ft-stack width="md">
  <ft-card heading="Appearance" [headingLevel]="2">
    <ft-stack gap="3">
      <ft-radio-group
        legend="Theme"
        name="theme"
        [ngModel]="preference()"
        (ngModelChange)="choose($event)"
      >
        <ft-radio value="light">Light</ft-radio>
        <ft-radio value="dark">Dark</ft-radio>
        <ft-radio value="system" description="Follows your device’s light or dark setting">
          Match my device
        </ft-radio>
      </ft-radio-group>
      <p class="caption">Changes straight away and is remembered on this device.</p>
    </ft-stack>
  </ft-card>

  @switch (state()) {
    @case ('loading') {
      <ft-card>
        <ft-stack role="status" aria-busy="true" aria-label="Loading your settings">
          <ft-skeleton shape="title" />
          <ft-skeleton />
        </ft-stack>
      </ft-card>
    }
    @case ('error') {
      <ft-empty-state
        variant="error"
        heading="We couldn’t load your settings"
        text="Check your connection and try again."
      >
        <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
      </ft-empty-state>
    }
    @case ('loaded') {
      <ft-card heading="Email me when" [headingLevel]="2">
        <ft-stack>
          <ft-switch [formControl]="announcementEmails">Email me announcements</ft-switch>
          <p class="caption">You’ll always get account emails like password resets.</p>
        </ft-stack>
      </ft-card>
    }
  }
</ft-stack>
