<ft-page-header title="Notifications" [subtitle]="subtitle()">
  @if (unread() > 0) {
    <ft-button ftPageHeaderActions variant="ghost" (click)="markAllRead()">
      <ft-icon name="done" /> Mark all as read
    </ft-button>
  }
  <ft-button ftPageHeaderActions variant="ghost" href="/settings">
    <ft-icon name="settings" /> Settings
  </ft-button>
</ft-page-header>

<ft-cluster gap="2" class="filters" role="group" aria-label="Show notifications">
  <ft-chip [pressed]="!unreadOnly()" (click)="show(false)">All</ft-chip>
  <ft-chip [pressed]="unreadOnly()" (click)="show(true)">Unread</ft-chip>
</ft-cluster>

@switch (state()) {
  @case ('loading') {
    <ft-list-skeleton label="Loading notifications" [rows]="4" />
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load your notifications"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">
        <ft-icon name="try-again" /> Try again
      </ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (notices().length === 0) {
      @if (unreadOnly()) {
        <ft-empty-state
          icon="notifications"
          heading="Nothing unread"
          text="You’ve read every notification. Choose All to see them again."
        />
      } @else {
        <ft-empty-state
          icon="notifications"
          heading="You’re all caught up"
          text="We’ll let you know when contacts join, events change, or someone sends an announcement."
        />
      }
    } @else {
      <ft-card variant="flush">
        <ft-notice-list
          [notices]="notices()"
          [deferNavigation]="true"
          (noticeOpened)="open($event)"
        />
      </ft-card>
      @if (hasMore()) {
        <div class="more">
          <ft-button [loading]="loadingMore()" (click)="showOlder()">
            Show older notifications
          </ft-button>
        </div>
      }
    }
  }
}
