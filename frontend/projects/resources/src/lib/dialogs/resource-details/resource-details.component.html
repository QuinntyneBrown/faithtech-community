@let f = form();
@if (showTitleAndType()) {
  <ft-form-field
    #titleField
    required
    label="Title"
    [help]="titleLength() + ' / 120'"
    [error]="errors()['title'] ?? ''"
  >
    <ft-text-field [formControl]="f.controls.title" />
  </ft-form-field>
}
<ft-form-field label="Description" [optional]="true" [error]="errors()['description'] ?? ''">
  <ft-textarea [rows]="3" [formControl]="f.controls.description" />
</ft-form-field>
@if (showTitleAndType()) {
  <ft-form-field
    #typeField
    required
    label="Type"
    [help]="typeHelp()"
    [error]="errors()['type'] ?? ''"
  >
    <ft-select
      placeholder="Choose a type"
      [options]="typeOptions()"
      [formControl]="f.controls.type"
    />
  </ft-form-field>
}
<ft-form-field
  label="Tags"
  [optional]="true"
  help="Press Enter or comma to add. Pick an existing tag so spellings stay the same."
  [error]="errors()['tags'] ?? ''"
>
  <ft-tag-input
    [formControl]="f.controls.tags"
    [suggestions]="tagSuggestions()"
    (query)="searchTags($event)"
  />
</ft-form-field>
<ft-radio-group
  legend="Who can see it"
  [formControl]="f.controls.visibility"
  [error]="visibility() === 'Shared' ? '' : (errors()['visibility'] ?? '')"
>
  <ft-radio value="Private" description="Only you (and System Admin).">Private</ft-radio>
  <ft-radio value="Shared" description="You and the people and roles you choose.">Shared</ft-radio>
  <ft-radio value="Global" description="Every signed-in member can find it.">Global</ft-radio>
</ft-radio-group>
@if (visibility() === 'Shared') {
  <fieldset class="share">
    <legend>Share with</legend>
    <ft-form-field label="People" [error]="errors()['visibility'] ?? ''">
      <ft-person-picker
        [formControl]="f.controls.members"
        [options]="people()"
        [loading]="searching()"
        listLabel="Members"
        (query)="searchPeople($event)"
      />
    </ft-form-field>
    <ft-checkbox-group legend="Roles" [formControl]="f.controls.roles">
      @for (role of roles(); track role.value) {
        <ft-checkbox [value]="role.value">{{ role.label }}</ft-checkbox>
      }
    </ft-checkbox-group>
    <p class="note">
      Everyone you add gets a notification. They can open and download it, but can’t share it on.
    </p>
  </fieldset>
}
