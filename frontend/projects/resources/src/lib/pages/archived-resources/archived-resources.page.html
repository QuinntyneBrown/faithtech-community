<ft-breadcrumb>
  <ft-breadcrumb-item href="/resources">Resources</ft-breadcrumb-item>
  <ft-breadcrumb-item>Archived</ft-breadcrumb-item>
</ft-breadcrumb>
<ft-page-header
  title="Archived resources"
  subtitle="Only you can see these. Each is deleted for good 30 days after you archive it."
/>

@switch (state()) {
  @case ('loading') {
    <ft-list-skeleton label="Loading archived resources" [rows]="3" />
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load your archived resources"
      text="Nothing has been deleted. Check your connection and try again."
    >
      <ft-button actions variant="primary" (click)="retry()">
        <ft-icon name="try-again" /> Try again
      </ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (list().length === 0) {
      <ft-empty-state
        icon="archive"
        heading="Nothing archived"
        text="When you archive a resource it waits here for 30 days, so you can change your mind."
      >
        <ft-button actions href="/resources">Back to Resources</ft-button>
      </ft-empty-state>
    } @else {
      <ft-card variant="flush">
        <ft-list label="Archived resources">
          @for (resource of list(); track resource.id) {
            <ft-list-item
              [label]="resource.title"
              [href]="'/resources/' + resource.id"
              [meta]="meta(resource)"
            >
              <ft-icon-tile leading [name]="typeIcon(resource)" />
              <ft-button
                trailing
                [object]="resource.title"
                [loading]="restoring() === resource.id"
                (click)="restore(resource)"
                ><ft-icon name="restore" /> Restore</ft-button
              >
            </ft-list-item>
          }
        </ft-list>
      </ft-card>
    }
  }
}
