<ft-auth-layout>
  <ft-card>
    @switch (state()) {
      @case ('working') {
        <div role="status">
          <ft-empty-state
            icon="email"
            [headingLevel]="1"
            heading="Turning off announcement emails…"
            text="This takes a moment. You don’t need to sign in."
          />
        </div>
      }
      @case ('done') {
        <ft-empty-state
          icon="success"
          [headingLevel]="1"
          heading="You’re unsubscribed"
          text="We won’t email you announcements any more. You’ll still see them in the app, and you’ll still get other emails, such as event changes and password resets. You can turn announcement emails back on in Settings."
        >
          <ft-button actions variant="primary" href="/settings">Open settings</ft-button>
        </ft-empty-state>
      }
      @case ('invalid') {
        <ft-empty-state
          variant="error"
          [headingLevel]="1"
          heading="This unsubscribe link doesn’t work"
          text="It may be incomplete or more than a year old. Sign in and turn off announcement emails in Settings instead."
        >
          <ft-button actions variant="primary" href="/settings">Open settings</ft-button>
        </ft-empty-state>
      }
    }
  </ft-card>
</ft-auth-layout>
