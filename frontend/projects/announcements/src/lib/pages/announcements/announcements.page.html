<ft-page-header
  title="Announcements"
  subtitle="In-app and email. People can opt out of announcement emails."
>
  @if (canSend()) {
    <ft-button ftPageHeaderActions variant="primary" href="/announcements/new">
      <ft-icon name="add" /> New announcement
    </ft-button>
  }
</ft-page-header>

@switch (state()) {
  @case ('loading') {
    <ft-list-skeleton label="Loading announcements" [rows]="3" />
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load announcements"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (rows().length === 0) {
      <ft-empty-state
        icon="announcements"
        heading="No announcements yet"
        [text]="
          canSend()
            ? 'Send news to everyone or to people with a role — in the app and by email.'
            : 'Announcements sent to you show up here and in your notifications.'
        "
      >
        @if (canSend()) {
          <ft-button actions variant="primary" href="/announcements/new"
            >New announcement</ft-button
          >
        }
      </ft-empty-state>
    } @else {
      <ft-card variant="flush">
        <ft-list label="Announcements">
          @for (row of rows(); track row.id) {
            <ft-list-item [label]="row.subject" [meta]="row.meta" [text]="row.body">
              <ft-icon-tile leading name="announcements" />
            </ft-list-item>
          }
        </ft-list>
      </ft-card>
      @if (hasMore()) {
        <div class="more">
          <ft-button [loading]="loadingMore()" (click)="showMore()"
            >Show more announcements</ft-button
          >
        </div>
      }
    }
  }
}
