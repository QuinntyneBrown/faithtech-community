<ft-dialog
  heading="Delete this photo?"
  [description]="description"
  icon="delete"
  tone="danger"
  [busy]="busy()"
  (closed)="ref.close(false)"
>
  @if (failed()) {
    <ft-alert status="danger" heading="That didn’t work">
      We couldn’t reach FaithTech. Nothing was changed — try again.
    </ft-alert>
  }
  <div class="photo">
    <ft-photo [src]="data.photo.url" [alt]="data.photo.altText" />
  </div>
  <ft-button ftDialogFooter initialFocus [disabled]="busy()" (click)="ref.close(false)"
    >Cancel</ft-button
  >
  <ft-button ftDialogFooter variant="danger" [loading]="busy()" (click)="confirm()">
    {{ busy() ? 'Delete photo…' : 'Delete photo' }}
  </ft-button>
</ft-dialog>
