@switch (state()) {
  @case ('loading') {
    <h1 class="visually-hidden">Profile</h1>
    <ft-profile-header name="" [loading]="true" />
  }
  @case ('not-found') {
    <h1 class="visually-hidden">Profile</h1>
    <ft-empty-state
      heading="We can’t find that profile"
      text="The link may be wrong, or the person may not have joined FaithTech yet."
    >
      <ft-button actions variant="primary" href="/">Go home</ft-button>
    </ft-empty-state>
  }
  @case ('error') {
    <h1 class="visually-hidden">Profile</h1>
    <ft-empty-state
      variant="error"
      heading="We couldn’t load this profile"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (profile(); as p) {
      <ft-profile-header
        [name]="p.name"
        [roles]="roles()"
        [location]="p.homeCity ?? ''"
        [bio]="p.bio ?? ''"
        [emptyBio]="p.isOwn ? 'You haven’t written a bio yet.' : null"
        [photoUrl]="p.featuredPhoto?.url ?? null"
        [photos]="photos()"
      >
        @if (p.isOwn) {
          <ft-button actions variant="primary" href="/people/me/edit">
            <ft-icon name="edit" /> Edit profile
          </ft-button>
        }
      </ft-profile-header>
      @if (p.isOwn && p.photos.length === 0) {
        <div class="photos-empty">
          <ft-empty-state
            heading="No photos yet"
            text="Add up to 10 photos. The one you feature becomes your picture across FaithTech."
          >
            <ft-button actions variant="primary" href="/people/me/edit">
              <ft-icon name="add" /> Add photos
            </ft-button>
          </ft-empty-state>
        </div>
      }
    }
  }
}
