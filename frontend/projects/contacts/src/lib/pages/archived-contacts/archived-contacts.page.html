<ft-breadcrumb>
  <ft-breadcrumb-item href="/contacts">Contacts</ft-breadcrumb-item>
  <ft-breadcrumb-item>Archived contacts</ft-breadcrumb-item>
</ft-breadcrumb>
<ft-page-header title="Archived contacts" subtitle="Kept until you restore or delete them" />

@switch (state()) {
  @case ('loading') {
    <ft-list-skeleton label="Loading archived contacts" [rows]="2" />
  }
  @case ('forbidden') {
    <ft-empty-state
      icon="locked"
      heading="Contacts are private to each lead"
      text="Staff can see everything else read-only, but contacts and their notes belong to the lead who created them."
    >
      <ft-button actions variant="primary" href="/">Back to home</ft-button>
    </ft-empty-state>
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load archived contacts"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (list().length === 0) {
      <ft-empty-state
        icon="archive"
        heading="Nothing archived"
        text="When you archive a contact it waits here until you restore it or delete it for good."
      >
        <ft-button actions href="/contacts">Back to contacts</ft-button>
      </ft-empty-state>
    } @else {
      <ft-card variant="flush">
        <ft-list label="Archived contacts">
          @for (contact of list(); track contact.id) {
            <ft-list-item [label]="contact.name" [meta]="meta(contact)">
              <ft-avatar leading size="sm" [name]="contact.name" />
              <ft-cluster trailing gap="2">
                <ft-button
                  [object]="contact.name"
                  [loading]="restoring() === contact.id"
                  (click)="restore(contact)"
                  >Restore</ft-button
                >
                <ft-button
                  variant="ghost"
                  [object]="contact.name + ' permanently'"
                  (click)="delete(contact)"
                  >Delete</ft-button
                >
              </ft-cluster>
            </ft-list-item>
          }
        </ft-list>
      </ft-card>
    }
  }
}
