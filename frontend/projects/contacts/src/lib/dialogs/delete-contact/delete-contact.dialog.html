<ft-dialog
  [heading]="'Delete ' + data.name + ' for good?'"
  description="This removes the contact and all your notes. It can’t be undone."
  icon="delete"
  tone="danger"
  [busy]="busy()"
  (closed)="ref.close(false)"
>
  <form (submit)="$event.preventDefault(); confirm()">
    <ft-stack>
      @if (failed()) {
        <ft-alert status="danger" heading="Contact not deleted">
          We couldn’t reach FaithTech. Nothing was changed — try again.
        </ft-alert>
      }
      <ft-form-field label="Type DELETE to confirm" [error]="error()">
        <ft-text-field
          [formControl]="confirmation"
          autocomplete="off"
          initialFocus
          (focusout)="blurred()"
        />
      </ft-form-field>
    </ft-stack>
  </form>
  <ft-button ftDialogFooter [disabled]="busy()" (click)="ref.close(false)">Cancel</ft-button>
  <ft-button
    ftDialogFooter
    variant="danger"
    [disabled]="!confirmed()"
    [loading]="busy()"
    (click)="confirm()"
  >
    {{ busy() ? 'Delete permanently…' : 'Delete permanently' }}
  </ft-button>
</ft-dialog>
