<textarea
  class="textarea"
  [attr.id]="id()"
  [attr.name]="name()"
  [rows]="rows()"
  [value]="value()"
  [placeholder]="placeholder()"
  [readOnly]="readonly()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="invalid()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>
