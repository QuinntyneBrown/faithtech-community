<nav class="tab-bar" [attr.aria-label]="label()">
  @for (item of items(); track item.href) {
    <a
      class="tab-bar__item"
      [attr.href]="item.href"
      [attr.aria-current]="item.current ? 'page' : null"
    >
      <ft-icon [name]="item.icon" size="lg" />
      <span class="tab-bar__label">{{ item.label }}</span>
    </a>
  }
  @if (moreLabel(); as moreText) {
    <button
      class="tab-bar__item"
      type="button"
      aria-haspopup="dialog"
      [attr.aria-current]="moreCurrent() ? 'true' : null"
      (click)="more.emit()"
    >
      <ft-icon name="more" size="lg" />
      <span class="tab-bar__label">{{ moreText }}</span>
    </button>
  }
</nav>
