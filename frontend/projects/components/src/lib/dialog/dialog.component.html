<div class="dialog" [attr.aria-busy]="busy() ? 'true' : null">
  <header class="dialog__header">
    @if (icon()) {
      <span class="dialog__icon" [class.dialog__icon--danger]="tone() === 'danger'">
        <ft-icon [name]="icon()!" />
      </span>
    }
    <div class="dialog__heading">
      <h2 class="dialog__title" [id]="titleId">{{ heading() }}</h2>
      @if (description()) {
        <p class="dialog__description" [id]="descriptionId">{{ description() }}</p>
      }
    </div>
    <button
      class="dialog__close"
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="closed.emit()"
    >
      <ft-icon name="close" />
    </button>
  </header>
  <div class="dialog__body"><ng-content /></div>
  <footer class="dialog__footer"><ng-content select="[ftDialogFooter]" /></footer>
</div>
