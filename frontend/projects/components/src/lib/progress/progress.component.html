<div class="ft-progress-row">
  @if (heading(); as text) {
    <span class="ft-progress-heading">{{ text }}</span>
  }
  <div
    class="ft-progress"
    [class.ft-progress--lg]="size() === 'lg'"
    [class.ft-progress--complete]="complete()"
    role="progressbar"
    aria-valuemin="0"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemax]="max()"
    [attr.aria-label]="label()"
  >
    <div class="ft-progress__bar" [style.--value]="percent() + '%'"></div>
  </div>
  @if (caption(); as text) {
    <span class="ft-progress-label">{{ text }}</span>
  }
</div>
