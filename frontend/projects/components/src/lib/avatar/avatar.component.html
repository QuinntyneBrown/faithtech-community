<ng-template #circle let-drawn>
  <span
    class="ft-avatar"
    [class]="'ft-avatar ft-avatar--' + color() + ' ft-avatar--' + size()"
    [attr.data-initials]="drawn ? initials() : null"
    aria-hidden="true"
    >{{ drawn ? '' : initials() }}
    @if (photo(); as url) {
      <img class="ft-avatar__img" [src]="url" alt="" (error)="failedSrc.set(url)" />
    }
  </span>
</ng-template>
@if (href(); as url) {
  <!-- Initials are drawn with CSS so the visible text never disagrees with the label (WCAG 2.5.3). -->
  <a class="ft-avatar-trigger" [attr.href]="url" [attr.aria-label]="label()">
    <ng-container [ngTemplateOutlet]="circle" [ngTemplateOutletContext]="{ $implicit: true }" />
  </a>
} @else {
  <ng-container [ngTemplateOutlet]="circle" [ngTemplateOutletContext]="{ $implicit: false }" />
}
