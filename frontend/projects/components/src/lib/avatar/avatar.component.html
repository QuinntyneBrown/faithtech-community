<ng-template #circle>
  <span
    class="ft-avatar"
    [class]="'ft-avatar ft-avatar--' + color() + ' ft-avatar--' + size()"
    aria-hidden="true"
    >{{ initials() }}</span
  >
</ng-template>
@if (href(); as url) {
  <a class="ft-avatar-trigger" [attr.href]="url" [attr.aria-label]="label()">
    <ng-container [ngTemplateOutlet]="circle" />
  </a>
} @else {
  <ng-container [ngTemplateOutlet]="circle" />
}
