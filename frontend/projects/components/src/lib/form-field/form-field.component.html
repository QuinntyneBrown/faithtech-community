<label class="label" [class.visually-hidden]="labelHidden()" [attr.for]="controlId()">
  {{ label() }}
  @if (optional()) {
    <span class="optional">(optional)</span>
  }
</label>
<ng-content />
@if (help()) {
  <div class="field__help" [id]="helpId()">{{ help() }}</div>
}
<div class="field__errors" [attr.aria-live]="announce ? 'polite' : null">
  @if (error()) {
    <ft-inline-message [id]="errorId()">{{ error() }}</ft-inline-message>
  }
</div>
