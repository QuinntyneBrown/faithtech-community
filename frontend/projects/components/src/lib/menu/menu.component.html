<button
  class="menu__trigger"
  type="button"
  [attr.aria-label]="label()"
  [cdkMenuTriggerFor]="panel"
  [cdkMenuPosition]="positions"
>
  <ng-content />
</button>

<ng-template #panel>
  <ul class="menu" cdkMenu role="menu" [attr.aria-label]="label()">
    @for (entry of entries(); track $index) {
      @switch (entry.kind) {
        @case ('header') {
          <li role="none" class="menu__header">
            <div class="menu__title">{{ entry.title }}</div>
            @if (entry.caption) {
              <div class="menu__caption">{{ entry.caption }}</div>
            }
          </li>
        }
        @case ('divider') {
          <li role="none" class="menu__divider" aria-hidden="true"></li>
        }
        @case ('item') {
          <li role="none">
            @if (entry.href) {
              <a
                ft-menu-item
                [icon]="entry.icon ?? null"
                [attr.href]="entry.href"
                [disabled]="entry.disabled ?? false"
                (click)="itemSelected.emit(entry.id)"
                >{{ entry.label }}</a
              >
            } @else {
              <button
                ft-menu-item
                type="button"
                [icon]="entry.icon ?? null"
                [disabled]="entry.disabled ?? false"
                (click)="itemSelected.emit(entry.id)"
              >
                {{ entry.label }}
              </button>
            }
          </li>
        }
      }
    }
  </ul>
</ng-template>
