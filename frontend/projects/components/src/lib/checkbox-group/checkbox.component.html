<label class="choice">
  <input
    type="checkbox"
    [name]="group.groupName()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="group.error() ? 'true' : null"
    (change)="onChange($event)"
    (blur)="group.touch()"
  />
  <span class="text">
    <ng-content />
    @if (description()) {
      <small>{{ description() }}</small>
    }
  </span>
</label>
