<ng-template #content>
  @if (variant() === 'google') {
    <img class="ft-button__brand" [src]="googleMark" alt="" width="18" height="18" />
  }
  <ng-content />
  @if (object(); as obj) {
    <span class="ft-button__object"> {{ obj }}</span>
  }
</ng-template>
@if (href(); as url) {
  <a
    [class]="classes()"
    [attr.href]="inert() ? null : url"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-disabled]="inert() ? 'true' : null"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.tabindex]="inert() ? -1 : null"
    [attr.role]="inert() ? 'link' : null"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    [class]="classes()"
    [attr.type]="type()"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="describedBy()"
    [disabled]="disabled()"
    [attr.aria-disabled]="loading() ? 'true' : null"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.cdkFocusInitial]="initialFocus() ? '' : null"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
