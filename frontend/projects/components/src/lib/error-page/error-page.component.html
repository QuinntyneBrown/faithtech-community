<div class="error-page">
  <span class="error-page__icon" aria-hidden="true"
    ><ft-icon [name]="copy().icon" size="lg"
  /></span>
  <h1 class="error-page__title">{{ heading() ?? copy().title }}</h1>
  <p class="error-page__text">{{ message() ?? copy().text }}</p>
  @if (showReference()) {
    <p class="error-page__reference">Reference: {{ reference() }}</p>
  }
  <div class="error-page__actions">
    @if (copy().retry) {
      <ft-button variant="primary" [loading]="retrying()" (click)="onRetry()">
        <ft-icon name="try-again" size="sm" /> Try again
      </ft-button>
    } @else {
      <ft-button variant="primary" [href]="homeHref()">Go home</ft-button>
      @if (kind() === 'not-found') {
        <ft-button [href]="searchHref()">Search</ft-button>
      }
    }
  </div>
</div>
