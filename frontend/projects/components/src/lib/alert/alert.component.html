<div
  [class]="'alert alert--' + status()"
  [attr.role]="role()"
  [attr.tabindex]="focusable() ? -1 : null"
>
  <ft-icon class="alert__icon" [name]="icon()" />
  <div class="alert__body">
    @if (heading(); as title) {
      <div class="alert__title">{{ title }}</div>
    }
    <div class="alert__text"><ng-content /></div>
    <div class="alert__actions"><ng-content select="[ftAlertActions]" /></div>
  </div>
  @if (dismissible()) {
    <button class="alert__close" type="button" aria-label="Dismiss" (click)="dismissed.emit()">
      <ft-icon name="close" size="sm" />
    </button>
  }
</div>
