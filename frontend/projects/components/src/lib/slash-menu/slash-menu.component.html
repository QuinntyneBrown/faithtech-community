<ul class="ft-slash-menu__list" role="listbox" [id]="listId()" [attr.aria-label]="label()">
  @for (option of options(); track option.id; let i = $index) {
    <li
      class="ft-slash-menu__item"
      role="option"
      [id]="optionId(i)"
      [attr.aria-selected]="i === active()"
      (mousedown)="$event.preventDefault()"
      tabindex="-1"
      (click)="chosen.emit(option.id)"
      (keydown.enter)="chosen.emit(option.id)"
    >
      <span class="ft-slash-menu__glyph" aria-hidden="true">{{ option.glyph }}</span>
      <span class="ft-slash-menu__text">
        <span class="ft-slash-menu__title">{{ option.label }}</span>
        @if (option.description) {
          <span class="ft-slash-menu__hint">{{ option.description }}</span>
        }
      </span>
      @if (option.shortcut) {
        <kbd class="ft-slash-menu__shortcut">{{ option.shortcut }}</kbd>
      }
    </li>
  } @empty {
    <li class="ft-slash-menu__empty" role="option" aria-disabled="true" aria-selected="false">
      {{ emptyText() }}
    </li>
  }
</ul>
