<div class="ft-kanban__card" [class.ft-kanban__card--movable]="movable()">
  <a class="ft-kanban__link" [attr.href]="href()">{{ title() }}</a>
  @if (caption()) {
    <span class="ft-kanban__caption">{{ caption() }}</span>
  }
  @if (movable()) {
    <ft-button
      variant="ghost"
      size="sm"
      [label]="'Move ' + title() + ' to another stage'"
      (click)="moveRequested.emit(cardId())"
    >
      <ft-icon name="move" size="sm" />
      Move
    </ft-button>
  }
</div>
