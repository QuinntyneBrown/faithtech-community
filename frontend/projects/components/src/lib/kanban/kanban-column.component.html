<section class="ft-kanban__column" [attr.aria-labelledby]="headingId">
  <div class="ft-kanban__header">
    <h2 class="ft-kanban__title" [id]="headingId">{{ title() }}</h2>
    <ft-badge>{{ count() }}</ft-badge>
  </div>
  <ul class="ft-kanban__list">
    <ng-content />
  </ul>
  @if (count() === 0) {
    <p class="ft-kanban__empty">{{ emptyText() }}</p>
  }
</section>
