<div class="page-header__titles">
  @if (overline(); as text) {
    <p class="page-header__overline">{{ text }}</p>
  }
  <h1 class="page-header__title">{{ title() }}</h1>
  @if (subtitle(); as text) {
    <p class="page-header__subtitle">{{ text }}</p>
  } @else {
    <p class="page-header__subtitle page-header__subtitle--slot">
      <ng-content select="[ftPageHeaderSubtitle]" />
    </p>
  }
</div>
<div class="page-header__actions"><ng-content select="[ftPageHeaderActions]" /></div>
