<label class="switch" [class.switch--label-hidden]="labelHidden()">
  <input
    type="checkbox"
    role="switch"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onToggle($event)"
    (blur)="onBlur()"
  />
  <span class="text" [class.visually-hidden]="labelHidden()"><ng-content /></span>
</label>
