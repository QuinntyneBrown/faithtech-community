<span
  [class]="'ft-sticker ft-sticker--' + size()"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="label() ? null : 'true'"
>
  <ng-content />
  @if (src(); as url) {
    @if (url !== failedSrc()) {
      <img class="ft-sticker__img" alt="" [src]="url" (error)="failedSrc.set(url)" />
    }
  }
</span>
