<div
  tabindex="-1"
  [class]="'toast toast--' + variant()"
  [attr.role]="role()"
  [attr.data-state]="leaving() ? 'leaving' : null"
  (keydown.escape)="dismissed.emit()"
  (mouseenter)="paused.emit()"
  (mouseleave)="resumed.emit()"
  (focusin)="paused.emit()"
  (focusout)="resumed.emit()"
>
  <ft-icon class="toast__icon" [name]="icon()" />
  <div class="toast__body">
    <div class="toast__title">{{ heading() }}</div>
    @if (text()) {
      <div class="toast__text">{{ text() }}</div>
    }
    @if (actionLabel()) {
      <button class="toast__action" type="button" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    }
  </div>
  <button class="toast__close" type="button" aria-label="Dismiss" (click)="dismissed.emit()">
    <ft-icon name="close" size="sm" />
  </button>
  @if (timed()) {
    <div
      class="toast__progress"
      aria-hidden="true"
      [style.animation-duration.ms]="duration()"
    ></div>
  }
</div>
