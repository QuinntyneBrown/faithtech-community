<ng-template #headingIconTpl>
  @if (headingIcon(); as icon) {
    <ft-icon [name]="icon" />
  }
</ng-template>
<ng-template #content>
  @if (heading(); as text) {
    <div class="ft-card__header">
      <div class="ft-card__heading">
        @switch (headingLevel()) {
          @case (3) {
            <h3 class="ft-card__title" [id]="headingId">
              <ng-container [ngTemplateOutlet]="headingIconTpl" />{{ text }}
            </h3>
          }
          @case (4) {
            <h4 class="ft-card__title" [id]="headingId">
              <ng-container [ngTemplateOutlet]="headingIconTpl" />{{ text }}
            </h4>
          }
          @default {
            <h2 class="ft-card__title" [id]="headingId">
              <ng-container [ngTemplateOutlet]="headingIconTpl" />{{ text }}
            </h2>
          }
        }
        <!-- A badge that belongs to the title, such as a sprint's "Active", sits right after it. -->
        <ng-content select="[ftCardTitleBadge]" />
      </div>
      <ng-content select="[ftCardActions]" />
    </div>
  }
  <ng-content />
</ng-template>
@if (variant() === 'media') {
  @if (mediaSrc(); as src) {
    <img class="ft-card__media" [src]="src" [alt]="mediaAlt()" />
  }
  <div class="ft-card__body">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
} @else {
  <ng-container [ngTemplateOutlet]="content" />
}
