<header class="top-bar">
  <a class="top-bar__brand" [attr.href]="homeHref()">
    <ft-logo-mark class="top-bar__mark" label="" />
    <span>FaithTech</span>
  </a>
  @if (!anonymous()) {
    <nav class="top-bar__nav" [attr.aria-label]="navLabel()">
      @for (link of links(); track link.href) {
        <a
          class="top-bar__link"
          [class.top-bar__link--secondary]="link.secondary"
          [attr.href]="link.href"
          [attr.aria-current]="link.current ? 'page' : null"
          >{{ link.label }}</a
        >
      }
    </nav>
  }
  <span class="top-bar__spacer"></span>
  @if (!anonymous()) {
    <form class="top-bar__search" role="search" (submit)="onSearch($event, q.value)">
      <label class="top-bar__hidden" [attr.for]="searchId">{{ searchLabel() }}</label>
      <input
        #q
        class="top-bar__input"
        type="search"
        name="q"
        [id]="searchId"
        [attr.placeholder]="searchPlaceholder()"
      />
    </form>
  }
  <div class="top-bar__actions"><ng-content select="[ftTopBarActions]" /></div>
</header>
