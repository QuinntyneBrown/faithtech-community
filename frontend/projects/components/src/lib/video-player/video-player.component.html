<figure class="video-player">
  <div class="video-player__frame">
    @if (unavailable()) {
      <img class="video-player__media" [src]="poster()" [alt]="posterAlt()" />
      <div class="video-player__unavailable">
        <ft-alert status="warning" heading="This video can’t play right now">
          Read the transcript below instead.
        </ft-alert>
      </div>
    } @else {
      <video
        class="video-player__media"
        controls
        preload="none"
        playsinline
        [attr.aria-label]="label()"
        [poster]="poster()"
        (error)="unavailable.set(true)"
      >
        <source [src]="src()" [type]="type()" (error)="unavailable.set(true)" />
        <track
          kind="captions"
          default
          [src]="captions()"
          [srclang]="captionsLanguage()"
          [label]="captionsLabel()"
        />
      </video>
    }
  </div>
  @if (caption(); as line) {
    <figcaption class="video-player__caption">{{ line }}</figcaption>
  }
  <details class="video-player__transcript" [open]="unavailable()">
    <summary>Read the transcript</summary>
    <p>{{ transcript() }}</p>
  </details>
</figure>
