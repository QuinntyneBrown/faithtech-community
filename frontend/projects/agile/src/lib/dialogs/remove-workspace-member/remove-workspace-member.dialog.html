<ft-dialog
  [heading]="'Remove ' + data.member.name + ' from ' + data.workspace.name + '?'"
  [description]="description"
  tone="danger"
  icon="delete"
  [busy]="busy()"
  (closed)="ref.close()"
>
  @if (failed()) {
    <ft-alert status="danger" heading="That didn’t work">
      We couldn’t reach FaithTech. Nothing was changed — try again.
    </ft-alert>
  }
  <ft-button ftDialogFooter [disabled]="busy()" (click)="ref.close()">Cancel</ft-button>
  <ft-button ftDialogFooter variant="danger" [loading]="busy()" (click)="remove()">
    {{ busy() ? 'Remove member…' : 'Remove member' }}
  </ft-button>
</ft-dialog>
