<ft-auth-layout>
  @if (refusal(); as r) {
    <ft-card>
      <ft-stack>
        <h1 class="not-a-member__text">You’re not a member of {{ r.organisation.name }}</h1>
        <p class="not-a-member__text">{{ lead() }}</p>
        @if (r.memberships.length) {
          <section aria-labelledby="other-h">
            <ft-stack gap="2">
              <h2 class="not-a-member__section-title" id="other-h">Your organisations</h2>
              <ft-card variant="flush">
                <ft-list>
                  @for (m of r.memberships; track m.host) {
                    <ft-list-item [label]="m.name" [href]="'https://' + m.host" [meta]="m.host">
                      <ft-icon-tile leading name="organisation" />
                    </ft-list-item>
                  }
                </ft-list>
              </ft-card>
            </ft-stack>
          </section>
        }
        <ft-button [block]="true" (click)="signOut()">Sign out</ft-button>
      </ft-stack>
    </ft-card>
  }
</ft-auth-layout>
