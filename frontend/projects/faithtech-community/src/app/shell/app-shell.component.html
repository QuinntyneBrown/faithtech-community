@if (unverified()) {
  <ft-banner status="warning" heading="Verify your email to RSVP">
    @switch (resend()) {
      @case ('sent') {
        We sent a new link to {{ user()?.email }}.
      }
      @case ('limited') {
        We’ve sent several links in the last hour. Please try again later.
      }
      @default {
        We sent a link to {{ user()?.email }}.
      }
    }
    @if (resend() !== 'sent') {
      <ft-button
        ftAlertActions
        variant="ghost"
        size="sm"
        [loading]="resend() === 'sending'"
        (click)="sendAgain()"
      >
        Send again
      </ft-button>
    }
  </ft-banner>
}
<main id="main" tabindex="-1">
  <router-outlet />
</main>
